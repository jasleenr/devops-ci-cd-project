<!DOCTYPE html>
<html>
<head>
  <title>Women Safety SOS</title>
</head>
<body>

<h2>Women Safety App 🚨</h2>

<button onclick="sendSOS()">🚨 SOS</button>

<p id="status"></p>

<audio id="siren" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<hr>

<h3>Add Emergency Contact</h3>

<input type="text" id="name" placeholder="Name">
<input type="text" id="phone" placeholder="Phone Number">
<button onclick="saveContact()">Save</button>

<ul id="contactList"></ul>

<script>
function sendSOS() {
  document.getElementById("siren").play();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition);
  } else {
    document.getElementById("status").innerHTML = "Geolocation not supported";
  }
}

function showPosition(position) {
  let lat = position.coords.latitude;
  let long = position.coords.longitude;

  let message = "🚨 I am in danger! My location: https://maps.google.com/?q=" 
                + lat + "," + long;

  document.getElementById("status").innerHTML = message;
}

function saveContact() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  let contact = { name, phone };

  let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
  contacts.push(contact);

  localStorage.setItem("contacts", JSON.stringify(contacts));

  displayContacts();
}

function displayContacts() {
  let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
  let list = document.getElementById("contactList");

  list.innerHTML = "";

  contacts.forEach(c => {
    let li = document.createElement("li");
    li.textContent = c.name + " - " + c.phone;
    list.appendChild(li);
  });
}

window.onload = displayContacts;
</script>

</body>
</html>
