<!DOCTYPE html>
<html>
<head>
  <title>Women Safety Alert</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }

    button {
      background: red;
      color: white;
      padding: 20px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }
  </style>
</head>

<body>

  <h1>Women Safety SOS Alert System</h1>

  <p>Click the button below in case of emergency</p>

  <button onclick="sendSOS()">🚨 SOS</button>

  <p id="msg"></p>

  <script>
    function sendSOS() {

      document.getElementById("msg").innerHTML =
        "🚨 Emergency Alert Sent! Opening your location...";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {

          let lat = position.coords.latitude;
          let lon = position.coords.longitude;

          let mapLink = "https://www.google.com/maps?q=" + lat + "," + lon;

          window.open(mapLink, "_blank");

        });
      } else {
        alert("Geolocation not supported");
      }
    }
  </script>

</body>
</html>
